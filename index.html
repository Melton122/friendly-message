<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>For Ameri — Back Then, Still Now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f2e8d3;
    --paper-edge: #e4d5b0;
    --ink: #4a3625;
    --ink-soft: #7a5f45;
    --rose: #c17b64;
    --teal: #5f8783;
    --gold: #c99a4a;
    --shadow: rgba(74,54,37,0.25);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(201,154,74,0.10), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(95,135,131,0.10), transparent 45%),
      var(--paper);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:1.5rem;color:var(--ink);position:relative;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(74,54,37,0.025) 0px, rgba(74,54,37,0.025) 1px, transparent 1px, transparent 3px);
    opacity:0.5;
  }

  .main-card{
    width:100%;max-width:520px;
    background:#faf3e3;
    border-radius:6px;
    padding:3rem 2.2rem;
    text-align:center;
    position:relative;z-index:2;
    box-shadow: 0 2px 0 var(--paper-edge), 0 22px 45px -15px var(--shadow), 0 0 0 1px rgba(74,54,37,0.06);
    transform:rotate(-0.6deg);
  }
  .main-card::before{
    content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-3deg);
    width:110px;height:34px;
    background:rgba(201,154,74,0.35);
    border:1px solid rgba(201,154,74,0.5);
    box-shadow:0 3px 6px rgba(0,0,0,0.08);
  }

  .cassette{
    width:88px;height:56px;margin:0 auto 0.6rem;
    background:linear-gradient(160deg,#3a2e22,#2a2018);
    border-radius:8px;position:relative;
    box-shadow:0 8px 16px -6px rgba(0,0,0,0.4), inset 0 0 0 2px rgba(255,255,255,0.05);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 12px;
  }
  .reel{
    width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle, #c99a4a 0 4px, #6b5334 4px 100%);
    animation:spin 3s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .cassette.paused .reel{ animation-play-state:paused; }

  h1{
    font-family:'Caveat',cursive;
    font-size:3rem;font-weight:700;
    color:var(--rose);
    margin-bottom:0.1rem;
    line-height:1;
  }
  .sub{
    font-family:'Courier Prime',monospace;
    font-size:0.85rem;letter-spacing:0.5px;
    color:var(--ink-soft);
    margin-bottom:2rem;
    text-transform:uppercase;
  }

  .cute-box{
    background:rgba(95,135,131,0.08);
    border-radius:4px;
    padding:1.5rem 1.2rem;
    margin:1.6rem 0;
    border:1.5px dashed var(--teal);
    position:relative;
  }
  .cute-box p:first-child{
    font-family:'Caveat',cursive;
    font-weight:600;font-size:1.4rem;color:var(--ink);
  }
  .cute-box p:last-child{
    font-family:'Courier Prime',monospace;
    font-size:0.78rem;opacity:0.7;margin-top:0.5rem;color:var(--ink-soft);
  }

  .btn{
    background:var(--rose);
    color:#fff8ee;border:none;
    padding:1rem 2.3rem;border-radius:3px;
    font-family:'Poppins',sans-serif;
    font-weight:600;font-size:1rem;letter-spacing:0.5px;
    cursor:pointer;
    box-shadow:0 10px 20px -8px rgba(193,123,100,0.55);
    transition:all 0.25s ease;
    display:inline-flex;align-items:center;gap:0.5rem;
    margin:0.6rem;
  }
  .btn:hover{ transform:translateY(-3px); box-shadow:0 16px 26px -8px rgba(193,123,100,0.65); background:#a8654f; }
  .btn:active{ transform:translateY(1px) scale(0.98); }

  .music-btn{
    background:transparent;
    color:var(--ink-soft);border:1.5px solid var(--gold);
    padding:0.5rem 1.3rem;border-radius:20px;
    font-family:'Courier Prime',monospace;
    font-weight:700;font-size:0.8rem;letter-spacing:0.5px;
    cursor:pointer;transition:all 0.25s ease;
    display:inline-flex;align-items:center;gap:0.5rem;
  }
  .music-btn.playing{ background:rgba(201,154,74,0.15); }

  /* Popup */
  .popup{
    position:fixed;inset:0;background:rgba(42,32,24,0.55);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity 0.35s ease;z-index:50;padding:1rem;
  }
  .popup.active{ opacity:1;pointer-events:auto; }

  .memory-book{
    width:100%;max-width:460px;max-height:88vh;
    background:#faf3e3;border-radius:6px;
    position:relative;display:flex;flex-direction:column;
    box-shadow:0 30px 60px rgba(0,0,0,0.4);
    overflow:hidden;
  }
  .book-header{
    padding:1.1rem 1.4rem;
    border-bottom:1.5px dashed var(--paper-edge);
    display:flex;align-items:center;justify-content:space-between;
  }
  .book-title{
    font-family:'Caveat',cursive;font-size:1.5rem;color:var(--rose);font-weight:700;
  }
  .close-btn{
    background:none;border:none;font-size:1.4rem;color:var(--ink-soft);cursor:pointer;
    width:32px;height:32px;border-radius:50%;
  }
  .close-btn:hover{ background:rgba(74,54,37,0.08); }
  .close-btn:focus-visible, .btn:focus-visible, .music-btn:focus-visible{
    outline:3px solid var(--teal); outline-offset:2px;
  }

  .loading-screen{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:3rem 1.5rem;gap:1rem;
  }
  .loading-screen p{ font-family:'Courier Prime',monospace;font-size:0.85rem;color:var(--ink-soft); }
  .progress-track{ width:75%;height:6px;background:var(--paper-edge);border-radius:3px;overflow:hidden; }
  .progress-fill{ height:100%;width:0%;background:var(--rose);transition:width 0.25s ease; }

  .typewriter{
    display:none;flex:1;flex-direction:column;
    padding:1.4rem 1.4rem 1rem;gap:0.7rem;
    overflow-y:auto;
  }
  .typing{
    font-family:'Courier Prime',monospace;font-size:0.8rem;color:var(--ink-soft);
    display:flex;align-items:center;gap:0.4rem;opacity:0.8;
  }
  .typing-dots span{
    display:inline-block;width:4px;height:4px;border-radius:50%;
    background:var(--ink-soft);margin-left:2px;
    animation:blink 1.2s infinite;
  }
  .typing-dots span:nth-child(2){ animation-delay:0.2s; }
  .typing-dots span:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{ 0%,100%{opacity:0.2;} 50%{opacity:1;} }

  .message{
    font-family:'Caveat',cursive;font-size:1.55rem;line-height:1.35;
    color:var(--ink);
    background:rgba(201,154,74,0.10);
    border-left:3px solid var(--gold);
    padding:0.7rem 1rem;border-radius:2px;
    align-self:flex-start;max-width:88%;
  }
  .message.proposal{
    font-size:1.9rem;color:var(--rose);
    background:rgba(193,123,100,0.10);
    border-left-color:var(--rose);
    max-width:100%;
  }

  .book-footer{
    padding:1rem 1.4rem 1.3rem;border-top:1.5px dashed var(--paper-edge);
    text-align:center;
  }
  .book-footer .btn{ font-size:0.85rem;padding:0.7rem 1.6rem; }

  /* confetti bits: paper scraps + hearts, restrained */
  .scrap{
    position:fixed;top:-20px;width:8px;height:12px;pointer-events:none;z-index:60;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(105vh) rotate(340deg); opacity:0.15; }
  }
  .mini-confetti{
    position:fixed;width:6px;height:6px;border-radius:1px;pointer-events:none;z-index:60;
    animation:pop 1s ease-out forwards;
  }
  @keyframes pop{
    to{ transform:translate(var(--dx), var(--dy)) scale(0); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .cassette .reel, .scrap, .mini-confetti, .main-card{ animation:none !important; }
  }

  @media (max-width:420px){
    .main-card{ padding:2.2rem 1.4rem; }
    h1{ font-size:2.4rem; }
  }
</style>
</head>
<body>

  <div class="main-card">
    <div class="cassette paused" id="cassette">
      <div class="reel"></div>
      <div class="reel"></div>
    </div>
    <h1>For Ameri</h1>
    <p class="sub">a little rewind &mdash; high school us</p>

    <div class="cute-box">
      <p>remember when we were just kids figuring it out?</p>
      <p>press play, take a minute, go back with me</p>
    </div>

    <button class="btn" id="openBtn">
      open the memory book
    </button>
    <br>
    <button class="music-btn" id="musicToggle">
      <span id="musicIcon">▶</span>
      <span id="musicLabel">play our song</span>
    </button>
  </div>

  <audio id="eastsideAudio" loop preload="none">
    <source src="oursong.mp3" type="audio/mpeg">
  </audio>

  <div class="popup" id="popup" role="dialog" aria-modal="true" aria-label="Memory book for Ameri">
    <div class="memory-book">
      <div class="book-header">
        <span class="book-title">our old times</span>
        <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
      </div>

      <div class="loading-screen" id="loadingScreen">
        <p>rewinding the tape...</p>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>

      <div class="typewriter" id="typewriterDiv"></div>

      <div class="book-footer" id="bookFooter" style="display:none;">
        <button class="btn" id="closeBtn2">close, but keep it in mind</button>
      </div>
    </div>
  </div>

<script>
(function(){
  const openBtn = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const closeBtn2 = document.getElementById('closeBtn2');
  const popup = document.getElementById('popup');
  const loadingScreen = document.getElementById('loadingScreen');
  const progressFill = document.getElementById('progressFill');
  const typewriterDiv = document.getElementById('typewriterDiv');
  const bookFooter = document.getElementById('bookFooter');
  const musicToggle = document.getElementById('musicToggle');
  const musicIcon = document.getElementById('musicIcon');
  const musicLabel = document.getElementById('musicLabel');
  const cassette = document.getElementById('cassette');
  const eastsideAudio = document.getElementById('eastsideAudio');

  // Edit these lines freely — this is where the real memories go.
  const messages = [
    "hey ameri...",
    "remember passing notes when the teacher wasn't looking?",
    "or walking home the long way, just to talk a little longer?",
    "we didn't have much figured out back then",
    "but somehow we were happy. really happy.",
    "I still think about those days more than you'd guess",
    "and I just wanted to remind you of that today",
    "I love you. All of you. Always."
  ];

  let msgIndex = 0;
  let isTyping = false;
  let typingTimer = null;
  let isPlaying = false;
  let audioError = false;

  function toggleMusic(){
    if (isPlaying){
      eastsideAudio.pause();
      isPlaying = false;
      musicToggle.classList.remove('playing');
      cassette.classList.add('paused');
      musicIcon.textContent = '▶';
      musicLabel.textContent = 'play our song';
    } else {
      eastsideAudio.play().then(() => {
        isPlaying = true;
        musicToggle.classList.add('playing');
        cassette.classList.remove('paused');
        musicIcon.textContent = '❚❚';
        musicLabel.textContent = 'pause our song';
      }).catch(() => {
        audioError = true;
        musicLabel.textContent = 'add oursong.mp3 file';
        setTimeout(() => { musicLabel.textContent = 'play our song'; }, 2500);
      });
    }
  }

  eastsideAudio.addEventListener('canplaythrough', () => { audioError = false; });

  function miniConfetti(el){
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const colors = ['#c99a4a','#c17b64','#5f8783','#e4d5b0'];
    for (let i=0;i<8;i++){
      const p = document.createElement('div');
      p.className = 'mini-confetti';
      p.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      const angle = Math.random()*2*Math.PI;
      const dist = 30 + Math.random()*50;
      p.style.setProperty('--dx', (Math.cos(angle)*dist) + 'px');
      p.style.setProperty('--dy', (Math.sin(angle)*dist - 20) + 'px');
      document.body.appendChild(p);
      setTimeout(() => { if (p.parentNode) p.remove(); }, 1050);
    }
  }

  function fallingScraps(){
    const colors = ['#c99a4a','#c17b64','#5f8783','#e4d5b0','#a8654f'];
    for (let i=0;i<26;i++){
      const s = document.createElement('div');
      s.className = 'scrap';
      s.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
      s.style.left = Math.random()*100 + 'vw';
      s.style.animationDuration = (Math.random()*2 + 2.8) + 's';
      s.style.opacity = 0.6 + Math.random()*0.3;
      document.body.appendChild(s);
      setTimeout(() => { if (s.parentNode) s.remove(); }, 3200);
    }
  }

  function openPopup(){
    if (!popup) return;
    popup.classList.add('active');
    document.body.style.overflow = 'hidden';
    if (closeBtn) closeBtn.focus();

    clearBook();
    msgIndex = 0;
    isTyping = false;
    typewriterDiv.style.display = 'none';
    bookFooter.style.display = 'none';
    loadingScreen.style.display = 'flex';
    progressFill.style.width = '0%';

    simulateLoading();
  }

  function simulateLoading(){
    let progress = 0;
    const interval = setInterval(() => {
      progress += Math.random()*22 + 8;
      if (progress >= 100){
        progress = 100;
        progressFill.style.width = '100%';
        clearInterval(interval);
        setTimeout(() => {
          loadingScreen.style.display = 'none';
          typewriterDiv.style.display = 'flex';
          if (!isTyping){
            isTyping = true;
            nextMessage();
          }
        }, 400);
      } else {
        progressFill.style.width = progress + '%';
      }
    }, 260);
  }

  function closePopup(){
    if (!popup) return;
    popup.classList.remove('active');
    document.body.style.overflow = '';
    if (typingTimer) clearTimeout(typingTimer);
    isTyping = false;
    if (openBtn) openBtn.focus();
  }

  function clearBook(){
    typewriterDiv.innerHTML = '';
    if (typingTimer){ clearTimeout(typingTimer); typingTimer = null; }
    isTyping = false;
  }

  function nextMessage(){
    if (!typewriterDiv || msgIndex >= messages.length){
      isTyping = false;
      bookFooter.style.display = 'block';
      fallingScraps();
      return;
    }
    const isLast = msgIndex === messages.length - 1;

    const typingEl = document.createElement('div');
    typingEl.className = 'typing';
    typingEl.innerHTML = 'flipping the page... <span class="typing-dots"><span></span><span></span><span></span></span>';
    typewriterDiv.appendChild(typingEl);
    typewriterDiv.scrollTop = typewriterDiv.scrollHeight;

    const delay = 550 + Math.random()*650;
    setTimeout(() => {
      if (typewriterDiv.contains(typingEl)) typewriterDiv.removeChild(typingEl);
      typeMessage(messages[msgIndex], isLast, () => {
        msgIndex++;
        if (msgIndex < messages.length){
          typingTimer = setTimeout(nextMessage, isLast ? 1800 : 1000);
        } else {
          nextMessage();
        }
      });
    }, delay);
  }

  function typeMessage(text, isSpecial, callback){
    if (!typewriterDiv) return;
    const bubble = document.createElement('div');
    bubble.className = 'message' + (isSpecial ? ' proposal' : '');
    typewriterDiv.appendChild(bubble);
    typewriterDiv.scrollTop = typewriterDiv.scrollHeight;

    let i = 0;
    function typeChar(){
      if (i < text.length){
        bubble.textContent += text.charAt(i);
        i++;
        typewriterDiv.scrollTop = typewriterDiv.scrollHeight;
        const speed = isSpecial ? 45 + Math.random()*30 : 26 + Math.random()*30;
        typingTimer = setTimeout(typeChar, speed);
      } else {
        miniConfetti(bubble);
        if (callback) callback();
      }
    }
    typeChar();
  }

  openBtn.addEventListener('click', openPopup);
  closeBtn.addEventListener('click', closePopup);
  closeBtn2.addEventListener('click', closePopup);
  popup.addEventListener('click', (e) => { if (e.target === popup) closePopup(); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && popup.classList.contains('active')) closePopup(); });
  musicToggle.addEventListener('click', toggleMusic);

  window.addEventListener('beforeunload', () => {
    if (typingTimer) clearTimeout(typingTimer);
    if (eastsideAudio) eastsideAudio.pause();
  });
})();
</script>
</body>
</html>
